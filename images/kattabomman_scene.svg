<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="fortBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2810" />
      <stop offset="50%" stop-color="#693914" />
      <stop offset="100%" stop-color="#2a1608" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#fortBg)"/>
  <!-- Panchalankurichi Fort Battlements -->
  <polygon points="50,340 50,150 90,150 90,180 130,180 130,150 170,150 170,180 210,180 210,150 250,150 250,340" fill="#1f1006" stroke="#c48a3f" stroke-width="2"/>
  <polygon points="350,340 350,150 390,150 390,180 430,180 430,150 470,150 470,180 510,180 510,150 550,150 550,340" fill="#1f1006" stroke="#c48a3f" stroke-width="2"/>
  <!-- Crossed Swords and Royal Shield -->
  <circle cx="300" cy="180" r="45" fill="#140a04" stroke="#e8a838" stroke-width="4"/>
  <line x1="240" y1="120" x2="360" y2="240" stroke="#f7d070" stroke-width="5"/>
  <line x1="360" y1="120" x2="240" y2="240" stroke="#f7d070" stroke-width="5"/>
  <polygon points="290,165 310,165 310,195 300,205 290,195" fill="#e8a838"/>
  <!-- Banner Plate -->
  <rect x="70" y="24" width="460" height="48" rx="8" fill="#140904" fill-opacity="0.9" stroke="#e8a838" stroke-width="2"/>
  <text x="300" y="55" font-family="Georgia, serif" font-size="19" font-weight="bold" fill="#f7d070" text-anchor="middle">VEERAPANDIYA KATTABOMMAN (1959)</text>
  <text x="300" y="300" font-family="'Poppins', sans-serif" font-size="14" fill="#fae8c8" text-anchor="middle">Afro-Asian Film Festival Award Winner &bull; Peerless Oratorical Grandeur</text>
</svg>