  <text x="300" y="325" font-family="'Poppins', sans-serif" font-size="13" fill="#ffebee" text-anchor="middle">Kamal Haasan &amp; R. Madhavan &bull; Written by Kamal Haasan &bull; Directed by Sundar C</text>
