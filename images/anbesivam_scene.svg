      <stop offset="0%" stop-color="#3e2723" />
      <stop offset="50%" stop-color="#5d4037" />
      <stop offset="100%" stop-color="#1b0000" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#anbeBg)"/>
